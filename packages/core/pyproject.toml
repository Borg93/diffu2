[project]
name = "diffu-core"
version = "0.1.0"
description = "What every workspace member shares about a model directory: its Modular Diffusers model index and loading its components."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # every member's: 3.12, NeMo AutoModel's environment runs diffu-page and diffu-flux3; 3.14 breaks pydantic's `from __future__ import annotations` models
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffusers",
    "pydantic>=2",
    "torch>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_core"]
