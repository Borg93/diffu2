# 23 Nov: the fine-tune again, from the pretraining's LAST checkpoint (dev CER 6.75 %) in place of the one its dev loss kept
# (step 1,000, dev CER 9.95 %); every checkpoint kept, so the best by dev CER can be read.
# CURATION E60, step 2: as E38's fine-tune (nemotron_parse_trusted_finetune.yaml), from the self-trained pretraining. One GPU.
name: nemotron-parse-selftrain-finetune2
description: "nemotron-parse-selftrain-pretrain fine-tuned on all GT training pages as nemotron-parse-all, 1 GPU"
job:
  kind: nemotron-parse
  model: {repo: /home/gabriel/Desktop/diffu2/runs/htr/nemotron-parse-selftrain-pretrain/output/checkpoint-4319}
  freeze_vision_encoder: false
  freeze_adapter: false
  coordinate_weight: 10.0
  activation_checkpointing: true
  bf16: true
  learning_rate: 5.0e-5
  epochs: 2
  global_batch: 32
  per_device_batch: 4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  dataloader_num_workers: 8
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 14
  best_by_eval_loss: true
  per_device_eval_batch_size: 4
  logging_steps: 10
  ddp_find_unused_parameters: false
data:
  train: [{path: data/htr/nemotron_parse_pages.train.jsonl}]
  dev: data/htr/nemotron_parse_pages.dev.jsonl
resources: {gpus_per_node: 1, need_gb: 60, hours: 60}
