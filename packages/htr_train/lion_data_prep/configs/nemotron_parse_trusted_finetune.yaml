# CURATION E38, step 2: fine-tuned on the GT as nemotron-parse-all (7.55 %) and nemotron-parse-svea-finetune (7.18 %).
name: nemotron-parse-trusted-finetune
description: "nemotron-parse-trusted-pretrain fine-tuned on all GT training pages as nemotron-parse-all, 2 GPUs"
job:
  kind: nemotron-parse
  model: {repo: /home/gabriel/Desktop/diffu2/runs/htr/nemotron-parse-trusted-pretrain/output}
  freeze_vision_encoder: false
  freeze_adapter: false
  coordinate_weight: 10.0
  activation_checkpointing: true
  bf16: true
  learning_rate: 5.0e-5
  epochs: 2
  global_batch: 32
  per_device_batch: 4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  dataloader_num_workers: 8
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 3
  best_by_eval_loss: true
  per_device_eval_batch_size: 4
  logging_steps: 10
  ddp_find_unused_parameters: false
data:
  train: [{path: data/htr/nemotron_parse_pages.train.jsonl}]
  dev: data/htr/nemotron_parse_pages.dev.jsonl
resources: {gpus_per_node: 2, need_gb: 60, hours: 48}
