# CURATION E38, step 1: Nemotron 3.5 Parse pretrained on the pool pages whose cut is trusted (stage_trusted.py: both pools,
# cut at the fold the placer finds, GT volumes left out), with the old pipeline's labels. The recipe of
# nemotron_parse_svea_pretrain.yaml, so the two pretrainings differ in their pages alone.
name: nemotron-parse-trusted-pretrain
description: "pool pages of both pools whose cut is trusted (CURATION E37), old htrflow labels, 1 epoch, 2 GPUs"
job:
  kind: nemotron-parse
  model: {repo: nvidia/Nemotron-3.5-Parse, revision: 72ad4d71dd827135ee581502363e14748008900a}
  freeze_vision_encoder: false
  freeze_adapter: false
  coordinate_weight: 10.0
  activation_checkpointing: true
  bf16: true
  learning_rate: 5.0e-5
  epochs: 1
  global_batch: 32
  per_device_batch: 4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  dataloader_num_workers: 8
  eval_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  save_total_limit: 3
  best_by_eval_loss: true
  per_device_eval_batch_size: 4
  logging_steps: 10
  ddp_find_unused_parameters: false
data:
  train: [{path: /mnt/scratch/gabriel/htr/trusted_v1_nemotron/pages.jsonl}]
  dev: data/htr/nemotron_parse_pages.dev.jsonl
resources: {gpus_per_node: 2, need_gb: 60, hours: 48}
