# lightonocr3-all's setup in small on two GPUs (--where local): 20 steps of 8 pages drawn from the training pages, 2 a
# GPU, then the whole dev set evaluated once and a checkpoint saved (its size and save time), to measure the step time
# and peak memory before the full run. Delete runs/htr/smoke-lightonocr3-2gpu afterwards (its checkpoint is ~63 GB).
name: smoke-lightonocr3-2gpu
description: "smoke: LightOnOCR-3-4B full, grounding pages (2048 px), 2 a GPU, 2 GPUs"
job:
  kind: lightonocr-3
  model: {repo: lightonai/LightOnOCR-3-4B, revision: b71010f095dc3735de7ee6b9969bff8f8f50b39a}
  tuner: full
  freeze_vit: false
  freeze_aligner: true
  freeze_llm: false
  learning_rate: 5.0e-6
  max_steps: 20
  global_batch: 8
  per_device_batch: 2
  lr_scheduler: cosine
  warmup_ratio: 0.05
  optim: adamw_torch_fused
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  max_length: 8192
  packing: false
  padding_free: false
  attn_impl: sdpa
  deepspeed: zero2
  gradient_checkpointing: true
  vit_gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  dataset_num_proc: 4
  dataloader_num_workers: 4
  load_from_cache_file: false
  dataset_shuffle: true  # the 160 pages are drawn at random; false takes the first 160
  train_dataloader_shuffle: true
  eval_strategy: steps
  eval_steps: 20
  save_strategy: steps
  save_steps: 20
  save_total_limit: 1
  save_only_model: false
  per_device_eval_batch_size: 2
  logging_steps: 1
data:
  train: [{path: data/htr/lightonocr3_pages.train.jsonl, samples: 160}]
  dev: data/htr/lightonocr3_pages.dev.jsonl
resources: {gpus_per_node: 2, need_gb: 80, hours: 1}
