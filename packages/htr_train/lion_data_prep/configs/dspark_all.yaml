# The DSpark draft for minicpm-all's checkpoint of least corpus CER on its dev lines (after_minicpm.sh links it as
# runs/htr/minicpm-all/best), from its own answers to 250,000 training lines and 50,000 training regions, each a
# seeded draw (htr-train serve-target, then htr-train dspark-set against it); 3 online epochs, vLLM on the first of
# the two GPUs and the trainer on the second (htr-train launch --where local, HTR_TRAIN_LOCAL_GPUS two GPUs), vLLM's
# front end from this server's 64 CPUs (3 API servers, 12 preparation workers), 8 dataloader workers (as measured on
# 2,400 of its samples, docs/HTR_RUNS.md). configs/full/dspark.yaml's recipe.
# OpenBMB's draft makes MiniCPM-OCR 55 % faster end to end on whole pages (OmniDocBench v1.6, one page at a time, RTX
# 5090; its reproduction commands are still to come): long answers, where a draft speeds up the decoding. Our regions
# are like that (about 250 tokens an answer); our lines are not: base MiniCPM-OCR's line serving read about 24,500
# prompt (mostly image) tokens a second against 400 generated (runs/htr/eval/vllm_base.log). So the draft is measured
# on the same lines and regions with it and without it, and kept for what it speeds up.
name: dspark-all
description: "DSpark draft for minicpm-all's best checkpoint, 250,000 line and 50,000 region answers"
job:
  kind: dspark
  target: {repo: ./runs/htr/minicpm-all/best}
  responses: data/htr/dspark_responses.jsonl
  media_root: data/htr
  serve_args:
    - --mm-processor-kwargs
    - '{"downsample_mode": "4x", "max_slice_nums": 9}'
    - --trust-request-mm-kwargs
    - --default-chat-template-kwargs
    - '{"enable_thinking": false}'
    - --limit-mm-per-prompt  # video off: vLLM's start-up probe of MiniCPM-OCR's video path fails on transformers 5.22.1
    - '{"image": 4, "video": 0}'
  vllm_memory: 0.35
  epochs: 3
  num_workers: 8
resources: {nodes: 1, gpus_per_node: 2, need_gb: 60, hours: 12, cpus_per_task: 64}
