[project]
name = "diffu-htr-train"
version = "0.1.0"
description = "Training our page and line readers (Unlimited-OCR 2, MiniCPM-OCR, MiniCPM-OCR-Jev) and a DSpark draft from run specs: ms-swift and speculators run in their own environments (envs/), this package renders and launches their commands and builds the sets they train on."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
# Light on purpose: each tool environment (envs/<name>) installs this package by path beside its own torch,
# transformers and ms-swift or speculators, whose pins conflict with each other and with the workspace's.
dependencies = [
    "httpx>=0.28",
    "pillow>=11",
    "pydantic>=2",
    "pydantic-settings>=2.15",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.20",
]

[project.scripts]
htr-train = "diffu_htr_train.cli:app"  # render, launch and queue reader trainings; build their dev splits, Jev pairs and draft data

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_htr_train"]
