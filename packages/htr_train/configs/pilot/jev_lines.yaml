# Jev pilot on the Spark: does fine-tuning teach Jev our historical hands? (Published Jev on our smoke pairs ranks a
# correct text above a wrong one 66 % of the time.) The smoke recipe for 2,000 steps on data/htr/pilot's pairs
# (htr-train jev-set on <=2,000 training lines a collection, dev 5 % by volume), evaluated every 500 steps.
name: pilot-jev-lines-en
description: "pilot: Jev from its checkpoint, our English prompt, 2,000 steps of 8 pairs from <=2,000 GT training lines a collection, real only"
job:
  kind: jev
  model: {repo: openbmb/MiniCPM-OCR-Jev, revision: a0ed278eb6aa1f333a711665ab610055a4a816ab}
  renderer: htr-train-jev-render-1+ae7b7855e115+pillow-12.2.0+freetype-2.14.3
  tuner: full
  freeze_vit: true
  freeze_aligner: true
  freeze_llm: false
  learning_rate: 1.0e-5
  max_steps: 2000
  global_batch: 8
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  max_length: 4096
  packing: false
  attn_impl: sdpa
  gradient_checkpointing: true
  dataset_num_proc: 2
  dataloader_num_workers: 2
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  save_only_model: true
  per_device_eval_batch_size: 1
  logging_steps: 10
  env: {IMAGE_MAX_TOKEN_NUM: "2048"}
data:
  train: [{path: data/htr/pilot/jev_en.train.jsonl}]
  dev: data/htr/pilot/jev_en.dev.jsonl
resources: {need_gb: 60, hours: 4}
