# MiniCPM-OCR on lines and regions mixed by ms-swift's sampling (each part's #N): 400,000 scaled lines and every
# training region at the scans' resolution, real GT pages and drawn pages (a diffu-run-export's PAGE files through
# diffu-reader-set --xml) as separate parts, so the mix is the spec's and each set stays one variant. The regions'
# dev volumes are the lines' (htr-train split-dev data/htr/minicpm_regions.jsonl --like
# data/htr/minicpm_lines_scaled.dev.jsonl), so no dev volume is trained on.
name: minicpm-lines-regions
description: "400k scaled lines + all regions (native), real + 100k drawn lines"
job:
  kind: minicpm-ocr
  model: {repo: openbmb/MiniCPM-OCR-1.0, revision: 2697d4e93dca82784abf858ae57206a49629cb6b}
  tuner: full
  freeze_vit: false
  freeze_aligner: true
  freeze_llm: false
  learning_rate: 5.0e-6
  epochs: 2
  global_batch: 128
  lr_scheduler: cosine
  warmup_ratio: 0.05
  optim: adamw_torch_fused
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  max_length: 4096
  packing: false
  padding_free: false
  attn_impl: sdpa
  deepspeed: zero2
  gradient_checkpointing: true
  vit_gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  dataset_num_proc: 8
  dataloader_num_workers: 8
  load_from_cache_file: false
  dataset_shuffle: true  # each part's #N is drawn at random; false takes its first N rows
  train_dataloader_shuffle: true
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  save_only_model: false
  best_by_eval_loss: true
  per_device_eval_batch_size: 1
  logging_steps: 10
  env: {DOWNSAMPLE_MODE: 4x}
data:
  train:
    - {path: data/htr/minicpm_lines_scaled.train.jsonl, samples: 400000}
    - {path: data/htr/minicpm_regions.train.jsonl}
    - {path: data/htr/minicpm_lines_drawn.jsonl, samples: 100000}
  dev: data/htr/minicpm_lines_scaled.dev.jsonl
resources: {nodes: 2, gpus_per_node: 4, need_gb: 40, hours: 24, cpus_per_task: 32}
