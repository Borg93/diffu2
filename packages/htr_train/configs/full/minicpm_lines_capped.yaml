# A cheaper variant of minicpm-lines-scaled: at most 20,000 training lines a collection (diffu-reader-set ...
# --max-per-collection 20000 --seed 0), so the large collections do not dominate; one epoch more to see as many steps
# per line. Compared with minicpm-lines-scaled on the same test lines.
name: minicpm-lines-capped
description: "GT training lines capped at 20,000 a collection, scaled to 448^2 px, real only"
job:
  kind: minicpm-ocr
  model: {repo: openbmb/MiniCPM-OCR-1.0, revision: 2697d4e93dca82784abf858ae57206a49629cb6b}
  tuner: full
  freeze_vit: false
  freeze_aligner: true
  freeze_llm: false
  learning_rate: 5.0e-6
  epochs: 4
  global_batch: 128
  lr_scheduler: cosine
  warmup_ratio: 0.05
  optim: adamw_torch_fused
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  max_length: 4096
  packing: false
  padding_free: false
  attn_impl: sdpa
  deepspeed: zero2
  gradient_checkpointing: true
  vit_gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  dataset_num_proc: 8
  dataloader_num_workers: 8
  load_from_cache_file: false
  dataset_shuffle: false
  train_dataloader_shuffle: true
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 3
  save_only_model: false
  best_by_eval_loss: true
  per_device_eval_batch_size: 1
  logging_steps: 10
  env: {DOWNSAMPLE_MODE: 4x}
data:
  train: [{path: data/htr/minicpm_lines_capped.train.jsonl}]
  dev: data/htr/minicpm_lines_capped.dev.jsonl
resources: {nodes: 2, gpus_per_node: 4, need_gb: 40, hours: 12, cpus_per_task: 32}
