# MiniCPM-OCR on every training line of the GT, each scaled to one 448 x 448 view (diffu-reader-set --task lines
# --max-crop-pixels 200704 --split-from-gt-test-lists, then htr-train split-dev), OpenBMB's full recipe as published
# (8 GPUs, ZeRO-2, global batch 128, 3 epochs, eval and save each epoch, the best by eval loss). On Leonardo: 2 nodes
# of 4 A100s. Estimate: ~28 h an epoch without packing on 8 A100s (docs/HTR_TRAIN.md).
name: minicpm-lines-scaled
description: "all GT training lines, scaled to 448^2 px, real only"
job:
  kind: minicpm-ocr
  model: {repo: openbmb/MiniCPM-OCR-1.0, revision: 2697d4e93dca82784abf858ae57206a49629cb6b}
  tuner: full
  freeze_vit: false
  freeze_aligner: true
  freeze_llm: false
  learning_rate: 5.0e-6
  epochs: 3
  global_batch: 128
  lr_scheduler: cosine
  warmup_ratio: 0.05
  optim: adamw_torch_fused
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0
  seed: 42
  data_seed: 42
  max_length: 4096
  packing: false
  padding_free: false
  attn_impl: sdpa
  deepspeed: zero2
  gradient_checkpointing: true
  vit_gradient_checkpointing: true
  gradient_checkpointing_kwargs: {use_reentrant: false}
  dataset_num_proc: 8
  dataloader_num_workers: 8
  load_from_cache_file: false
  dataset_shuffle: false
  train_dataloader_shuffle: true
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 3
  save_only_model: false
  best_by_eval_loss: true
  per_device_eval_batch_size: 1
  logging_steps: 10
  env: {DOWNSAMPLE_MODE: 4x}
data:
  train: [{path: data/htr/minicpm_lines_scaled.train.jsonl}]
  dev: data/htr/minicpm_lines_scaled.dev.jsonl
resources: {nodes: 2, gpus_per_node: 4, need_gb: 40, hours: 24, cpus_per_task: 32}
