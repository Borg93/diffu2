# Unlimited-OCR 2 full fine-tune (language model; vision encoder and projector frozen as in the LoRA) on every GT
# training page, ZeRO-2 over 2 nodes of 4 GPUs (~65 GB a GPU alone, ~20-25 GB sharded: estimates).
name: uocr2-full
description: "full fine-tune on all GT training pages (single pages), real only"
job:
  kind: unlimited-ocr-2
  model: {repo: baidu/Unlimited-OCR-2, revision: 0480966938291445591f69f08a13b041c073a96a}
  tuner: full
  freeze_vit: true
  freeze_aligner: true
  freeze_llm: false
  learning_rate: 1.0e-5
  epochs: 2
  global_batch: 64
  warmup_ratio: 0.05
  lr_scheduler: cosine
  weight_decay: 0.1
  max_grad_norm: 1.0
  max_length: 4096
  deepspeed: zero2
  gradient_checkpointing: true
  dataset_num_proc: 8
  dataloader_num_workers: 8
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  best_by_eval_loss: true
  per_device_eval_batch_size: 1
  logging_steps: 10
  report_to: tensorboard
data:
  train: [{path: data/htr/uocr2_pages.train.jsonl}]
  dev: data/htr/uocr2_pages.dev.jsonl
resources: {nodes: 2, gpus_per_node: 4, need_gb: 70, hours: 8, cpus_per_task: 32}
