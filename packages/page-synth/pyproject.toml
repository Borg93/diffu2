[project]
name = "page-synth"
version = "0.1.0"
description = "FLUX.3 page synthesis: crop geometry, scan look, provenance and caption grammar shared by LoRA training data and generation."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # matches the workspace
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
# The core (geometry, look, provenance, caption, records) needs only these. The FLUX.3 generator also needs torch,
# diffusers main (Modular Diffusers + FLUX.3) and transformers, which today live in the NeMo AutoModel environment.
dependencies = [
    "diffu-page",
    "numpy>=1.26",
    "pillow>=11",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/page_synth"]

[tool.uv.sources]
diffu-page = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
