[project]
name = "diffu-moss"
version = "0.1.0"
description = "MOSS-Image as a model family of the page pipeline: our own DiT (the released weights load into it by name), its Modular Diffusers blocks and pipeline, and a crop's layout caption compiled as MOSS's Layout prompt."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffu",
    "diffusers",
    "pydantic>=2",
    "rich>=13",
    "torch>=2.10",
    "transformers>=5.18",  # Qwen3.5, MOSS-Image's text encoder
    "typer>=0.20",
]

[project.scripts]
diffu-moss-init = "diffu_moss.init:app"  # a MOSS model repo: the Base snapshot's components around its own or a trained DiT

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_moss"]
