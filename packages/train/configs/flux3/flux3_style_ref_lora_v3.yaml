# FLUX.3 Klein Base reference-style LoRA (v3): draw a crop's text and layout in the hand, ink and paper of a
# reference crop from another page of the same volume (diffu_page.data.style_pairs -> data_flux3/style_pairs_v3, cached by
# diffu_train.cache_pairs). The captions are FLUX.3 image-edit records that name no archive or look, so the style can
# only come from the reference. Otherwise the v2 recipe (flux3_layout_lora_v2.yaml).
# Based on NeMo AutoModel's examples/diffusion/finetune/flux3_i2i_flow.yaml with the image-editing LoRA block of
# its FLUX.3 guide (docs/model-coverage/diffusion/black-forest-labs/flux3-image-klein.mdx), which also trains the
# reference-image stream. Paths come from the environment: DIFFU_REPO (this repo, required) and FLUX3_MODEL (the
# model directory, required). run_v3.sh sets both; by hand, from the NeMo AutoModel repo root:
#
#   DIFFU_REPO=~/Desktop/repos/diffu2 uv run --no-sync torchrun \
#       --nproc-per-node=1 examples/diffusion/finetune/finetune.py -c $DIFFU_REPO/packages/train/configs/flux3/flux3_style_ref_lora_v3.yaml

seed: 42

# Metrics to the local trackio project "diffu" (~/.cache/huggingface/trackio; no Space): `trackio list runs --project
# diffu`. The job scripts name each run (--trackio.name).
trackio:
  project: diffu
  name: flux3_style_v3

wandb:
  enable: false
  project: flux3-layout
  mode: offline
  name: flux3_style_ref_lora_v3

dist_env:
  backend: "nccl"
  init_method: "env://"
  timeout_minutes: 30

model:
  pretrained_model_name_or_path: ${FLUX3_MODEL}
  model_type: "flux3"
  mode: "finetune"
  cache_dir: null
  attention_backend: "native"  # torch SDPA; flash-attn isn't built for this aarch64 / sm_121 box

# Rank 32 as in v2. The guide's image-editing target list: attention + feed-forward of every block (the image,
# text and reference streams), the image and reference embedders, the output and the text projector.
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 32
  alpha: 32
  dropout: 0.0
  lora_dtype: bfloat16
  target_modules:
    - "*.to_q"
    - "*.to_k"
    - "*.to_v"
    - "*.to_out.0"
    - "*.ff.linear_in"
    - "*.ff.linear_out"
    - "x_embedders.image"
    - "proj_out"
    - "context_embedder"
    - "x_embedders.image_cond"

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 1e-5

fsdp:
  dp_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true
  cpu_offload: false
  defer_fsdp_grad_sync: true
  enable_compile: false
  enable_fsdp2_prefetch: false

# The recipe's flow matching: uniform timesteps with FLUX.3's fixed shift 6.93, no CFG dropout (as v2).
flow_matching:
  adapter_type: "flux3"
  timestep_sampling: "uniform"
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 6.93
  mix_uniform_ratio: 0.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  cfg_dropout_prob: 0.0
  i2v_prob: 0.0
  use_loss_weighting: false
  log_interval: 25
  summary_log_interval: 10

# One pair per micro-batch (pairs differ in target size, reference size and caption length); 4 per optimizer step.
step_scheduler:
  num_epochs: 1000
  local_batch_size: 1
  global_batch_size: 4
  max_steps: 1600
  ckpt_every_steps: 200
  log_remote_every_steps: 10
  save_checkpoint_every_epoch: false

data:
  dataloader:
    # diffu_train.nemo: NeMo's image-edit loader with the (target, reference)
    # shape buckets interleaved, so 1,600 steps over 11k pairs see every crop shape
    _target_: diffu_train.nemo.InterleavedImageEditDataloaderConfig
    cache_dir: ${DIFFU_REPO}/data_flux3/cache_style_v3
    quantization: 16
    base_resolution: [1024, 1024]
    num_workers: 2
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: ${DIFFU_REPO}/runs/flux3_style_ref_lora_v3
  model_save_format: torch_save
  save_consolidated: false
  restore_from: null
