# FLUX.3 Klein Base text-to-image LoRA, v2 data (layout_crops_v2: collection, years and scan type in the
# captions, margin notes / headings / page numbers with their roles, bucket-exact crops); otherwise the
# pilot recipe (flux3_layout_lora.yaml) with 1600 steps for the larger, style-labelled set.
# Based on NeMo AutoModel's examples/diffusion/finetune/flux3_t2i_flow_lora.yaml (the validated T2I LoRA
# recipe) with the overrides its FLUX.3 guide uses for few GPUs: native attention, activation checkpointing,
# no FSDP2 prefetch. Paths come from the environment: DIFFU_REPO (this repo, required) and FLUX3_MODEL (the
# model directory, required). run_v2.sh sets both; by hand, from the NeMo AutoModel repo root:
#
#   DIFFU_REPO=~/Desktop/repos/diffu2 uv run --no-sync torchrun --nproc-per-node=1 \
#       examples/diffusion/finetune/finetune.py -c $DIFFU_REPO/packages/train/configs/flux3/flux3_layout_lora_v2.yaml

seed: 42

# Metrics to the local trackio project "diffu" (~/.cache/huggingface/trackio; no Space): `trackio list runs --project
# diffu`. The job scripts name each run (--trackio.name).
trackio:
  project: diffu
  name: flux3_layout_v2

wandb:
  enable: false
  project: flux3-layout
  mode: offline
  name: flux3_layout_lora_v2

dist_env:
  backend: "nccl"
  init_method: "env://"
  timeout_minutes: 30

model:
  pretrained_model_name_or_path: ${FLUX3_MODEL}
  model_type: "flux3"
  mode: "finetune"
  cache_dir: null
  attention_backend: "native"  # torch SDPA; flash-attn isn't built for this aarch64 / sm_121 box

# Rank 32 (the recipe's 4 is for a style; this LoRA learns archival hands and following line boxes). The
# recipe's T2I target list: attention + feed-forward of the image and text per-mode blocks and the joint
# blocks, the image embedder, the output and the text projector; the inactive reference stream is left out.
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 32
  alpha: 32
  dropout: 0.0
  lora_dtype: bfloat16
  target_modules:
    - "mode_blocks.image.[0-9]*.attn.to_q"
    - "mode_blocks.image.[0-9]*.attn.to_k"
    - "mode_blocks.image.[0-9]*.attn.to_v"
    - "mode_blocks.image.[0-9]*.attn.to_out.0"
    - "mode_blocks.image.[0-9]*.ff.linear_in"
    - "mode_blocks.image.[0-9]*.ff.linear_out"
    - "txt_mode_blocks.*.attn.to_q"
    - "txt_mode_blocks.*.attn.to_k"
    - "txt_mode_blocks.*.attn.to_v"
    - "txt_mode_blocks.*.attn.to_out.0"
    - "txt_mode_blocks.*.ff.linear_in"
    - "txt_mode_blocks.*.ff.linear_out"
    - "single_transformer_blocks.*.attn.to_q"
    - "single_transformer_blocks.*.attn.to_k"
    - "single_transformer_blocks.*.attn.to_v"
    - "single_transformer_blocks.*.attn.to_out.0"
    - "single_transformer_blocks.*.ff.linear_in"
    - "single_transformer_blocks.*.ff.linear_out"
    - "x_embedders.image"
    - "proj_out"
    - "context_embedder"

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 1e-5

fsdp:
  dp_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true
  cpu_offload: false
  defer_fsdp_grad_sync: true
  enable_compile: false
  enable_fsdp2_prefetch: false

# The recipe's flow matching: uniform timesteps with FLUX.3's fixed shift 6.93, no CFG dropout. The adapter
# zeroes dropped text embeddings while inference CFG encodes an empty prompt, so dropout would train a mode
# that sampling never uses.
flow_matching:
  adapter_type: "flux3"
  timestep_sampling: "uniform"
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 6.93
  mix_uniform_ratio: 0.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  cfg_dropout_prob: 0.0
  i2v_prob: 0.0
  use_loss_weighting: false
  log_interval: 25
  summary_log_interval: 10

# One crop per micro-batch (crops differ in size and caption length); 4 per optimizer step.
step_scheduler:
  num_epochs: 1000
  local_batch_size: 1
  global_batch_size: 4
  max_steps: 1600
  ckpt_every_steps: 200
  log_remote_every_steps: 10
  save_checkpoint_every_epoch: false

data:
  dataloader:
    # diffu_train.nemo: NeMo's builder with the aspect buckets interleaved,
    # so 1,600 steps over 11k crops see every crop shape, not just the buckets first in line
    _target_: diffu_train.nemo.InterleavedTextToImageDataloaderConfig
    cache_dir: ${DIFFU_REPO}/data_flux3/cache_train_v2
    train_text_encoder: false
    num_workers: 2
    base_resolution: [1024, 1024]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: ${DIFFU_REPO}/runs/flux3_layout_lora_v2
  model_save_format: torch_save
  save_consolidated: false
  restore_from: null
