[project]
name = "diffu-studio"
version = "0.1.0"
description = "A Gradio app on the page pipeline: a template page, a text and a style in; every crop drawn, with its labels, out."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffu-page",
    "diffusers",
    "gradio>=6",
    "gradio-client>=2",
    "pillow>=11",
    "pydantic>=2",
    "typer>=0.20",
]

[project.scripts]
diffu-studio = "diffu_studio.studio:app"  # the app, on a model directory and its LoRAs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_studio"]
