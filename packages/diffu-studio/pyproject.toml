[project]
name = "diffu-studio"
version = "0.1.0"
description = "Diffu Studio — a gradio.Server control panel for single-line + whole-page handwriting synthesis."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # matches the workspace; 3.14 crashes pydantic (see root pyproject).
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]

# Studio deps live HERE. It drives BOTH the line generator (diffu) and the page compositor (diffu-page);
# gradio's Server mode brings FastAPI + uvicorn. Heavy model deps (torch/transformers) come via `diffu`.
# The PiD 4× upscaler (and its whole dependency tail) comes via `diffu-page[upscale]` — the pid dep is
# declared in ONE place (diffu-page) so the studio and the Ray page runner can't drift on its version.
dependencies = [
    "diffu",
    "diffu-page[upscale]",
    "gradio>=5.49",
    "pydantic>=2",
    "numpy>=1.26",
]

[project.optional-dependencies]
zerogpu = ["spaces", "aokit"]  # only inside a Hugging Face ZeroGPU Space (aokit = AoT compile for H200)
torchao = ["torchao"]  # optional int8/fp8 quant lever (VRAM/speed) behind the pluggable backend

[project.scripts]
diffu-studio = "diffu_studio.__main__:main"  # launch the control-panel server (Gradio UI + SSE API)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_studio"]

[tool.uv.sources]
diffu = { workspace = true }
diffu-page = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
