[project]
name = "diffu-runner"
version = "0.1.0"
description = "Generation at scale on a Ray cluster: pages planned on CPU, crops drawn by GPU actors holding a CropGenerator, rows written to Parquet."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffu-page",
    "pydantic>=2",
    "ray[data]==2.59.0",  # pinned: the actor API is version-sensitive; match the cluster's Ray
    "rich>=13",
    "typer>=0.20",
]

[project.scripts]
diffu-run = "diffu_runner.run:app"  # generate a run's pages across a Ray cluster

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_runner"]
