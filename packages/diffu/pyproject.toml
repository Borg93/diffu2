[project]
name = "diffu"
version = "0.1.0"
description = "diffu: FLUX.3's architecture (diffusers' Flux3Transformer2DModel and Modular Diffusers blocks) with our own weights, a Qwen3.5 text encoder and the Qwen-Image VAE."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffusers",
    "pydantic>=2",
    "rich>=13",
    "safetensors>=0.4",
    "torch>=2.10",
    "transformers>=5.18",
    "typer>=0.20",
]

[project.scripts]
diffu-init = "diffu.init:app"  # a diffu model repo with freshly initialised weights

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu"]
