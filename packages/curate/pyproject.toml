[project]
name = "diffu-curate"
version = "0.1.0"
description = "Curating real archive scans with machine-made labels into training sets: every page of a pool as a row of a Lance table, scored by checks on its labels, the checks calibrated on the scans the ground truth also holds."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffu-page",
    "numpy>=1.26",
    "pillow>=11",
    "pydantic>=2",
    "pydantic-settings>=2.15",
    "pylance==13.0.0",  # Lance itself, as diffu-runner pins it
    "rich>=13",
    "scikit-learn>=1.5",  # clustering page embeddings (and INSID3-style segmentation by example)
    "typer>=0.20",
]

[project.scripts]
diffu-curate = "diffu_curate.cli:app"  # a pool's pages scored, calibrated and sampled

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_curate"]
