[project]
name = "diffu-gen"
version = "0.1.0"
description = "Generation with Modular Diffusers: a crop plan in, an image with its read-back and labels out (FLUX.3 + LoRAs today, diffu later)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffu-page",
    "diffusers",
    "peft>=0.17",
    "pydantic-settings>=2.15",
    "rich>=13",
    "safetensors>=0.4",
    "torch>=2.10",
    "torchvision>=0.25",  # Qwen3-VL's processor (the FLUX.3 text encoder's tokenizer) needs it
    "transformers>=5.18",
    "typer>=0.20",
]

[project.scripts]
diffu-generate = "diffu_gen.cli.generate:app"  # pages from templates and text
diffu-evaluate = "diffu_gen.cli.evaluate:app"  # held-out crops, read-back CER against the real crops
diffu-sheets = "diffu_gen.cli.sheets:app"  # contact sheets of a steering run

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_gen"]
