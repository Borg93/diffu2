[project]
name = "diffu-page"
version = "0.1.0"
description = "Archive pages as data: PAGE/ALTO layouts, training-scale crops, their captions and labels, and the training-data builders. CPU only."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=11",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu_page"]
