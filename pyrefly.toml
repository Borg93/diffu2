project-includes = ["src/**/*.py", "packages/*/src/**/*.py"]
project-excludes = ["**/.git/**", "**/__pycache__/**", "**/.venv/**"]

# The ML libraries' stubs don't model their dynamic attributes (diffusers block state, transformers configs), so they
# are typed as Any: we check our own logic, not theirs. NeMo AutoModel and the torchdata it brings exist only in
# NeMo's own environment.
replace-imports-with-any = [
    "torch", "torch.*",
    "diffusers", "diffusers.*",
    "transformers", "transformers.*",
    "safetensors", "safetensors.*",
    "nemo_automodel", "nemo_automodel.*",
    "torchdata", "torchdata.*",
    "numpy", "numpy.*",
    "PIL", "PIL.*",
]

[errors]
# Every class we override comes from diffusers or NeMo, which are typed as Any above, so pyrefly can never see the
# parent and reports each @override as overriding nothing. @override stays on them as documentation.
bad-override = false
