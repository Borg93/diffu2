project-includes = ["src/**/*.py", "packages/*/src/**/*.py", "tests/**/*.py", "packages/*/tests/**/*.py", "conftest.py"]
project-excludes = ["**/.git/**", "**/__pycache__/**", "**/.venv/**"]
# The repo root, so tests that type a fixture by the root conftest.py's protocols resolve `conftest`, as ty does.
search-path = ["."]

# diffusers' and transformers' stubs don't model their dynamic attributes (block state, configs), so they are typed as
# Any: we check our own logic, not theirs. NeMo AutoModel and the torchdata it brings exist only in NeMo's own
# environment. torch, numpy and PIL ship their own types and are checked, as ty checks them (pyproject.toml).
replace-imports-with-any = [
    "diffusers", "diffusers.*",
    "transformers", "transformers.*",
    "safetensors", "safetensors.*",
    "nemo_automodel", "nemo_automodel.*",
    "torchdata", "torchdata.*",
]

[errors]
# diffusers and NeMo, typed as Any above, are the parents of most classes we override, so pyrefly cannot see them and
# would report each @override as overriding nothing. ty checks the overrides whose parents it sees (torch's).
bad-override = false
