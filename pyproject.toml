[project]
name = "diffu"
version = "0.1.0"
description = "diffu: our page model, FLUX.3's architecture (diffusers' Flux3Transformer2DModel and Modular Diffusers blocks) with our own weights, a Qwen3.5 text encoder and the Qwen-Image VAE."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # 3.14 breaks pydantic's `from __future__ import annotations` models
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = [
    "diffusers",
    "pydantic>=2",
    "rich>=13",
    "safetensors>=0.4",
    "torch>=2.10",
    "transformers>=5.18",
    "typer>=0.20",
]

[project.scripts]
diffu-init = "diffu.init:app"  # a diffu model repo with freshly initialised weights

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffu"]

# The repo's root project is the diffu model; the members under packages/ are the page pipeline and what runs it.
[tool.uv]
default-groups = ["workspace", "dev"]
environments = ["sys_platform == 'linux'"]  # CUDA wheels are Linux-only

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
diffu = { workspace = true }
diffu-page = { workspace = true }
diffu-train = { workspace = true }
diffu-runner = { workspace = true }
diffu-studio = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# FLUX.3 (Flux3Transformer2DModel, its Modular Diffusers blocks and LoRA loader) is on diffusers main only. This is
# the commit the NeMo AutoModel environment runs, so both environments run the same blocks.
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "e04f0c5f24392fcd34b32d18d0ce03668f9bcd50" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
workspace = ["diffu-page", "diffu-train", "diffu-runner", "diffu-studio"]  # every member; diffu-train's modules import NeMo at runtime
dev = [
    "ruff>=0.17.1",
    "pyrefly>=1.4",
    "pytest>=9.1.1",
    "xmlschema>=4.3.2",
    "pytest-cov>=7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass".msg = "Structured values are pydantic BaseModel (NeMo dataloader configs are the exception)."

[tool.ruff.lint.isort]
known-first-party = ["diffu", "diffu_page", "diffu_train", "diffu_runner", "diffu_studio"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q --import-mode=importlib"
strict = true

[tool.coverage.run]  # per-test coverage when pruning: production lines only, never the tests'
source = ["src", "packages/page/src", "packages/runner/src", "packages/studio/src", "packages/train/src"]
omit = ["tests/*", "packages/*/tests/*", "conftest.py"]

# ty, as pyrefly.toml: diffusers, transformers and safetensors are typed as Any (diffusers exports a torch-less dummy
# for every class, so each use reads as "real class or dummy"), and NeMo AutoModel and its torchdata exist only in
# NeMo's own environment. torch, numpy and PIL ship their own types and are checked.
[tool.ty.analysis]
replace-imports-with-any = [
    "diffusers.**", "diffusers",
    "transformers.**", "transformers",
    "safetensors.**", "safetensors",
    "nemo_automodel.**", "nemo_automodel",
    "torchdata.**", "torchdata",
]

[tool.ty.terminal]
error-on-warning = true
