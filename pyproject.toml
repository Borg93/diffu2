# The root is the workspace alone, no [project] (a virtual root): `uv sync` and `uv run` install every member under
# packages/, which are what the others share about a model directory (core), MOSS-Image, the page pipeline, FLUX.3's
# training glue and what runs them.
[tool.uv]
environments = ["sys_platform == 'linux'"]  # CUDA wheels are Linux-only

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
diffu-core = { workspace = true }
diffu-moss = { workspace = true }
diffu-page = { workspace = true }
diffu-train = { workspace = true }
diffu-runner = { workspace = true }
diffu-studio = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# FLUX.3 (Flux3Transformer2DModel, its Modular Diffusers blocks and LoRA loader) is on diffusers main only. This is
# the commit the NeMo AutoModel environment runs, so both environments run the same blocks.
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "e04f0c5f24392fcd34b32d18d0ce03668f9bcd50" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "pyrefly>=1.4",
    "pytest>=9.1.1",
    "xmlschema>=4.3.2",
    "pytest-cov>=7",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass".msg = "Structured values are pydantic BaseModel (NeMo dataloader configs are the exception)."

[tool.ruff.lint.isort]
known-first-party = ["diffu_core", "diffu_moss", "diffu_page", "diffu_train", "diffu_runner", "diffu_studio"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --import-mode=importlib"
strict = true
timeout = 3600  # pytest-timeout: a hung test fails; the slowest (the studio's draw test) takes about a minute on CPU

[tool.coverage.run]  # per-test coverage when pruning: production lines only, never the tests'
source = ["packages/core/src", "packages/moss/src", "packages/page/src", "packages/runner/src", "packages/studio/src", "packages/train/src"]
omit = ["packages/*/tests/*", "conftest.py"]

# ty, as pyrefly.toml: diffusers, transformers and safetensors are typed as Any (diffusers exports a torch-less dummy
# for every class, so each use reads as "real class or dummy"), and NeMo AutoModel and its torchdata exist only in
# NeMo's own environment. torch, numpy and PIL ship their own types and are checked.
[tool.ty.analysis]
replace-imports-with-any = [
    "diffusers.**", "diffusers",
    "transformers.**", "transformers",
    "safetensors.**", "safetensors",
    "nemo_automodel.**", "nemo_automodel",
    "torchdata.**", "torchdata",
]

[tool.ty.terminal]
error-on-warning = true
