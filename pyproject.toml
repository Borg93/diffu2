[project]
name = "diffu-workspace"
version = "0.1.0"
description = "Synthetic archive pages with ground truth for HTR and VLM training: the page pipeline and the diffu model."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # 3.14 breaks pydantic's `from __future__ import annotations` models
license = "Apache-2.0"
authors = [{ name = "Gabriel Borg" }]
dependencies = []

# A virtual workspace root: nothing to build here, the code lives in the members under packages/.
[tool.uv]
package = false
default-groups = ["workspace", "dev"]
environments = ["sys_platform == 'linux'"]  # CUDA wheels are Linux-only

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
page-synth = { workspace = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# FLUX.3 (Flux3Transformer2DModel, its Modular Diffusers blocks and LoRA loader) is on diffusers main only. This is
# the commit the NeMo AutoModel environment runs, so both environments run the same blocks.
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "e04f0c5f24392fcd34b32d18d0ce03668f9bcd50" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
workspace = ["page-synth"]
dev = [
    "ruff>=0.17.1",
    "pyrefly>=1.4",
    "pytest>=9.1.1",
    "xmlschema>=4.3.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass".msg = "Structured values are pydantic BaseModel (NeMo dataloader configs are the exception)."

[tool.ruff.lint.isort]
known-first-party = ["page_synth"]

[tool.pytest.ini_options]
testpaths = ["packages/page-synth/tests"]
addopts = "-q --import-mode=importlib"
